name: Odoo Multi Version Migration Lab

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Select action"
        required: true
        type: choice
        options:
          - setup_15
          - upgrade_15_16
          - upgrade_16_17
          - upgrade_17_18
          - rollback_15_16
          - rollback_16_17
          - rollback_17_18

jobs:
  odoo:
    runs-on: ubuntu-latest

    steps:
      - name: Execute on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          script: |

            set -e
            ACTION="${{ github.event.inputs.action }}"
            echo "Selected Action: $ACTION"

            sudo apt update
            sudo apt install -y git python3 python3-venv python3-pip \
                                postgresql postgresql-contrib

            sudo service postgresql start

            sudo -u postgres psql -c "CREATE USER odoo WITH PASSWORD '${{ secrets.DB_PASSWORD }}';" || true
            sudo -u postgres psql -c "ALTER USER odoo WITH SUPERUSER;" || true

            export PGPASSWORD=${{ secrets.DB_PASSWORD }}

            sudo mkdir -p /opt/odoo/backups
            sudo chown -R ubuntu:ubuntu /opt/odoo

            ##############################
            # SETUP ODOO 15
            ##############################

            if [ "$ACTION" = "setup_15" ]; then

              cd /opt/odoo

              git clone --depth 1 -b 15.0 https://github.com/odoo/odoo.git odoo15 || true

              dropdb -U odoo odoo15_db || true
              createdb -U odoo odoo15_db

              python3 -m venv venv15
              source venv15/bin/activate
              pip install wheel
              pip install -r odoo15/requirements.txt

              ./odoo15/odoo-bin -d odoo15_db --stop-after-init

              pg_dump -U odoo odoo15_db > backups/odoo15_backup.sql

              echo "Odoo 15 Installed"

              psql -U odoo -d odoo15_db -Atc \
              "SELECT latest_version FROM ir_module_module WHERE name='base';"

            fi

            ##############################
            # 15 → 16
            ##############################

            if [ "$ACTION" = "upgrade_15_16" ]; then

              cd /opt/odoo

              git clone --depth 1 -b 16.0 https://github.com/odoo/odoo.git odoo16 || true
              git clone --depth 1 -b 16.0 https://github.com/OCA/OpenUpgrade.git openupgrade16 || true

              dropdb -U odoo odoo16_db || true
              createdb -U odoo odoo16_db

              psql -U odoo odoo16_db < backups/odoo15_backup.sql

              python3 -m venv venv16
              source venv16/bin/activate
              pip install wheel
              pip install -r openupgrade16/requirements.txt
              pip install openupgradelib psycopg2-binary

              ./openupgrade16/odoo-bin \
                -d odoo16_db \
                --update=all \
                --stop-after-init \
                --load=base,web,openupgrade_framework

              pg_dump -U odoo odoo16_db > backups/odoo16_backup.sql

              echo "Upgraded to Odoo 16"

              psql -U odoo -d odoo16_db -Atc \
              "SELECT latest_version FROM ir_module_module WHERE name='base';"

            fi

            ##############################
            # 16 → 17
            ##############################

            if [ "$ACTION" = "upgrade_16_17" ]; then

              cd /opt/odoo

              git clone --depth 1 -b 17.0 https://github.com/odoo/odoo.git odoo17 || true
              git clone --depth 1 -b 17.0 https://github.com/OCA/OpenUpgrade.git openupgrade17 || true

              dropdb -U odoo odoo17_db || true
              createdb -U odoo odoo17_db

              psql -U odoo odoo17_db < backups/odoo16_backup.sql

              python3 -m venv venv17
              source venv17/bin/activate
              pip install wheel
              pip install -r openupgrade17/requirements.txt
              pip install openupgradelib psycopg2-binary

              ./openupgrade17/odoo-bin \
                -d odoo17_db \
                --update=all \
                --stop-after-init \
                --load=base,web,openupgrade_framework

              pg_dump -U odoo odoo17_db > backups/odoo17_backup.sql

              echo "Upgraded to Odoo 17"

              psql -U odoo -d odoo17_db -Atc \
              "SELECT latest_version FROM ir_module_module WHERE name='base';"

            fi

            ##############################
            # 17 → 18
            ##############################

            if [ "$ACTION" = "upgrade_17_18" ]; then

              cd /opt/odoo

              git clone --depth 1 -b 18.0 https://github.com/odoo/odoo.git odoo18 || true
              git clone --depth 1 -b 18.0 https://github.com/OCA/OpenUpgrade.git openupgrade18 || true

              dropdb -U odoo odoo18_db || true
              createdb -U odoo odoo18_db

              psql -U odoo odoo18_db < backups/odoo17_backup.sql

              python3 -m venv venv18
              source venv18/bin/activate
              pip install wheel
              pip install -r openupgrade18/requirements.txt
              pip install openupgradelib psycopg2-binary

              ./openupgrade18/odoo-bin \
                -d odoo18_db \
                --update=all \
                --stop-after-init \
                --load=base,web,openupgrade_framework

              pg_dump -U odoo odoo18_db > backups/odoo18_backup.sql

              echo "Upgraded to Odoo 18"

              psql -U odoo -d odoo18_db -Atc \
              "SELECT latest_version FROM ir_module_module WHERE name='base';"

            fi

            ##############################
            # ROLLBACKS
            ##############################

            if [ "$ACTION" = "rollback_15_16" ]; then
              dropdb -U odoo odoo16_db || true
              createdb -U odoo odoo16_db
              psql -U odoo odoo16_db < backups/odoo15_backup.sql
              echo "Rolled back to Odoo 15"
            fi

            if [ "$ACTION" = "rollback_16_17" ]; then
              dropdb -U odoo odoo17_db || true
              createdb -U odoo odoo17_db
              psql -U odoo odoo17_db < backups/odoo16_backup.sql
              echo "Rolled back to Odoo 16"
            fi

            if [ "$ACTION" = "rollback_17_18" ]; then
              dropdb -U odoo odoo18_db || true
              createdb -U odoo odoo18_db
              psql -U odoo odoo18_db < backups/odoo17_backup.sql
              echo "Rolled back to Odoo 17"
            fi
