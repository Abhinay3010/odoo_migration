name: Odoo Migration

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Select migration action'
        required: true
        default: 'upgrade_15_to_16'
        type: choice
        options:
          - upgrade_15_to_16
          - rollback_16_to_15
          - upgrade_16_to_17
          - rollback_17_to_16

jobs:
  migration:
    runs-on: ubuntu-latest

    env:
      ODOO_DB_USER: odoo
      ODOO_PG_PASSWORD: ${{ secrets.ODOO_PG_PASSWORD }}
      ODOO15_DIR: odoo15
      ODOO16_DIR: openupgrade16
      ODOO17_DIR: openupgrade17
      BACKUP_DIR: backups

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Show selected action
        run: |
          echo "Selected action: ${{ github.event.inputs.action }}"
          echo "Starting migration workflow..."
