name: Odoo Migration

# Manual trigger only
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Select migration action'
        required: true
        default: 'upgrade_15_to_16'
        type: choice
        options:
          - upgrade_15_to_16
          - rollback_16_to_15
          - upgrade_16_to_17
          - rollback_17_to_16

jobs:
  migration:
    runs-on: ubuntu-latest
    env:
      ODOO_DB_USER: odoo
      ODOO_PG_PASSWORD: ${{ secrets.ODOO_PG_PASSWORD }}
      ODOO15_DIR: odoo15
      ODOO16_DIR: openupgrade16
      ODOO17_DIR: openupgrade17
      BACKUP_DIR: backups

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Show selected action
        run: echo "Selected action: ${{ github.event.inputs.action }}"

      - name: Install DB dependencies
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run migration/rollback
        run: |
          if [ "${{ github.event.inputs.action }}" = "upgrade_15_to_16" ]; then
            bash scripts/upgrade_15_to_16.sh
          elif [ "${{ github.event.inputs.action }}" = "rollback_16_to_15" ]; then
            bash scripts/rollback_16_to_15.sh
          elif [ "${{ github.event.inputs.action }}" = "upgrade_16_to_17" ]; then
            bash scripts/upgrade_16_to_17.sh
          elif [ "${{ github.event.inputs.action }}" = "rollback_17_to_16" ]; then
            bash scripts/rollback_17_to_16.sh
          else
            echo "Invalid action"
            exit 1
          fi

      - name: Verify DB version
        run: |
          VERSION=$(psql -U $ODOO_DB_USER -d odoo16 -Atc "SELECT latest_version FROM ir_module_module WHERE name='base';")
          echo "Odoo version after migration/rollback: $VERSION"
