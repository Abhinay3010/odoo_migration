name: Odoo Multi Version Migration Lab

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Select action"
        required: true
        type: choice
        options:
          - setup_15
          - upgrade_15_16
          - upgrade_16_17
          - upgrade_17_18
          - rollback_15_16
          - rollback_16_17
          - rollback_17_18

jobs:
  odoo:
    runs-on: ubuntu-latest

    steps:
      - name: Execute on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail
            ACTION="${{ github.event.inputs.action }}"

            echo "==============================="
            echo "Selected Action: $ACTION"
            echo "==============================="

            #######################################
            # SYSTEM PREP
            #######################################

            sudo apt update -y
            sudo apt install -y software-properties-common curl

            # Install Python 3.9 safely (for Odoo 15)
            if ! command -v python3.9 >/dev/null 2>&1; then
              echo "Installing Python 3.9 from deadsnakes..."
              sudo add-apt-repository ppa:deadsnakes/ppa -y
              sudo apt update -y
              sudo apt install -y python3.9 python3.9-venv python3.9-dev
            fi

            # Ensure Python 3.10 exists
            sudo apt install -y python3.10 python3.10-venv python3.10-dev || true

            # Install other dependencies
            sudo apt install -y git build-essential libpq-dev \
                                postgresql postgresql-contrib \
                                python3-pip

            sudo systemctl enable postgresql
            sudo systemctl start postgresql

            echo "Python versions:"
            python3 --version || true
            python3.9 --version || true
            python3.10 --version || true

            #######################################
            # FIX POSTGRES AUTH
            #######################################

            sudo sed -i 's/local\s\+all\s\+postgres\s\+.*/local all postgres peer/' /etc/postgresql/*/main/pg_hba.conf
            sudo sed -i 's/local\s\+all\s\+all\s\+.*/local all all md5/' /etc/postgresql/*/main/pg_hba.conf
            sudo systemctl restart postgresql

            #######################################
            # CREATE ODOO USER
            #######################################

            ODOO_PASSWORD="${{ secrets.DB_PASSWORD }}"
            ODOO_USER="odoo"

            sudo -u postgres psql -tc "SELECT 1 FROM pg_roles WHERE rolname='$ODOO_USER'" | grep -q 1 || \
              sudo -u postgres psql -c "CREATE USER $ODOO_USER WITH PASSWORD '$ODOO_PASSWORD';"

            sudo -u postgres psql -c "ALTER USER $ODOO_USER WITH SUPERUSER;" || true
            export PGPASSWORD="$ODOO_PASSWORD"

            #######################################
            # DIRECTORY SETUP
            #######################################

            sudo mkdir -p /opt/odoo/backups
            sudo chown -R ubuntu:ubuntu /opt/odoo
            cd /opt/odoo

            #######################################
            # FUNCTIONS
            #######################################

            print_version() {
              psql -h localhost -U $ODOO_USER -d $1 -Atc \
              "SELECT latest_version FROM ir_module_module WHERE name='base';"
            }

            git_clone_or_update() {
              REPO_URL=$1
              BRANCH=$2
              DIR=$3

              if [ -d "$DIR/.git" ]; then
                echo "Updating $DIR"
                git -C $DIR fetch --depth 1 origin $BRANCH
                git -C $DIR reset --hard origin/$BRANCH
              else
                echo "Cloning $DIR"
                git clone --depth 1 -b $BRANCH $REPO_URL $DIR
              fi
            }

            create_venv() {
              PYTHON_BIN=$1
              VENV_DIR=$2
              REQUIREMENTS=$3

              if [ ! -d "$VENV_DIR" ]; then
                $PYTHON_BIN -m venv $VENV_DIR
                source $VENV_DIR/bin/activate
                pip install --upgrade pip wheel setuptools
                pip install -r $REQUIREMENTS
                pip install openupgradelib psycopg2-binary || true
              fi

              source $VENV_DIR/bin/activate
            }

            #######################################
            # SETUP ODOO 15 (Python 3.9)
            #######################################

            if [ "$ACTION" = "setup_15" ]; then
              git_clone_or_update https://github.com/odoo/odoo.git 15.0 odoo15

              sudo -u postgres dropdb odoo15_db || true
              sudo -u postgres createdb -O $ODOO_USER odoo15_db

              create_venv python3.9 venv15 odoo15/requirements.txt

              ./odoo15/odoo-bin -d odoo15_db --stop-after-init

              pg_dump -h localhost -U $ODOO_USER odoo15_db > backups/odoo15_backup.sql

              echo "Odoo 15 Installed"
              print_version odoo15_db
            fi

            #######################################
            # 15 → 16 (Python 3.10)
            #######################################

            if [ "$ACTION" = "upgrade_15_16" ]; then
              git_clone_or_update https://github.com/odoo/odoo.git 16.0 odoo16
              git_clone_or_update https://github.com/OCA/OpenUpgrade.git 16.0 openupgrade16

              sudo -u postgres dropdb odoo16_db || true
              sudo -u postgres createdb -O $ODOO_USER odoo16_db
              psql -h localhost -U $ODOO_USER odoo16_db < backups/odoo15_backup.sql

              create_venv python3.10 venv16 openupgrade16/requirements.txt

              ./openupgrade16/odoo-bin -d odoo16_db \
                --upgrade-path=openupgrade16/openupgrade_scripts/scripts \
                --update=all --stop-after-init \
                --load=base,web,openupgrade_framework

              pg_dump -h localhost -U $ODOO_USER odoo16_db > backups/odoo16_backup.sql
              print_version odoo16_db
            fi

            #######################################
            # 16 → 17
            #######################################

            if [ "$ACTION" = "upgrade_16_17" ]; then
              git_clone_or_update https://github.com/odoo/odoo.git 17.0 odoo17
              git_clone_or_update https://github.com/OCA/OpenUpgrade.git 17.0 openupgrade17

              sudo -u postgres dropdb odoo17_db || true
              sudo -u postgres createdb -O $ODOO_USER odoo17_db
              psql -h localhost -U $ODOO_USER odoo17_db < backups/odoo16_backup.sql

              create_venv python3.10 venv17 openupgrade17/requirements.txt

              ./openupgrade17/odoo-bin -d odoo17_db \
                --upgrade-path=openupgrade17/openupgrade_scripts/scripts \
                --update=all --stop-after-init \
                --load=base,web,openupgrade_framework

              pg_dump -h localhost -U $ODOO_USER odoo17_db > backups/odoo17_backup.sql
              print_version odoo17_db
            fi

            #######################################
            # 17 → 18
            #######################################

            if [ "$ACTION" = "upgrade_17_18" ]; then
              git_clone_or_update https://github.com/odoo/odoo.git 18.0 odoo18
              git_clone_or_update https://github.com/OCA/OpenUpgrade.git 18.0 openupgrade18

              sudo -u postgres dropdb odoo18_db || true
              sudo -u postgres createdb -O $ODOO_USER odoo18_db
              psql -h localhost -U $ODOO_USER odoo18_db < backups/odoo17_backup.sql

              create_venv python3.10 venv18 openupgrade18/requirements.txt

              ./openupgrade18/odoo-bin -d odoo18_db \
                --upgrade-path=openupgrade18/openupgrade_scripts/scripts \
                --update=all --stop-after-init \
                --load=base,web,openupgrade_framework

              pg_dump -h localhost -U $ODOO_USER odoo18_db > backups/odoo18_backup.sql
              print_version odoo18_db
            fi
