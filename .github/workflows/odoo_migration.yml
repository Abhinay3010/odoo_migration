name: Odoo Migration

on:
  workflow_dispatch:    # Manual trigger from GitHub UI

env:
  PGPASSWORD: ${{ secrets.ODOO_PG_PASSWORD }}

jobs:

  upgrade-15-to-16:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Run Upgrade 15 → 16
        run: bash scripts/upgrade_15_to_16.sh

  rollback-16-to-15:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Rollback 16 → 15
        run: bash scripts/rollback_16_to_15.sh

  upgrade-16-to-17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: bash scripts/upgrade_16_to_17.sh

  rollback-17-to-16:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: bash scripts/rollback_17_to_16.sh

  upgrade-17-to-18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: bash scripts/upgrade_17_to_18.sh

  rollback-18-to-17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: bash scripts/rollback_18_to_17.sh
